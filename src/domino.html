<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domino: Digital Service Catalog</title>
    <link rel="stylesheet" href="./brand-specific/brand.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/domino.svg">
</head>
<body>

<div id="side-overlay" tabindex="-1"></div>

<aside id="side-drawer" aria-hidden="true" aria-labelledby="side-title" role="dialog">
    <header class="drawer-header">
        <h1>Domino ⚅ Dependency Mapping Visualization Tool</h1>
        <button id="side-close" aria-label="Close">✖</button>
    </header>

    <nav class="content">
        <ul class="actions">
            <li><button id="act-about">ℹ️ About</button></li>
            <li><button id="act-upload">📤 Upload CSV</button></li>
            <li><button id="act-fit">↺ Fit to content</button></li>

            <li>
                <label class="switch-label">
                    🚫 Show Decommissioned
                    <input type="checkbox" id="toggle-decommissioned">
                    <span class="slider"></span>
                </label>
            </li>
            <li>
                <label class="switch-label">
                    🎛️ Relaxed Search
                    <input type="checkbox" id="relaxed-search">
                    <span class="slider"></span>
                </label>
            </li>


            <li>
                <label class="switch-label">
                    🌙 Dark Mode
                    <input type="checkbox" id="toggle-dark-mode">
                    <span class="slider"></span>
                </label>
            </li>

            <li><button id="act-introduce">➕ Introduce New Service</button></li>
            <li><button id="act-update">✏️ Update Service Info</button></li>
            <li><button id="act-switch" onclick="window.location.href='./solitaire.html'">♤ Solitaire</button></li>
        </ul>
    </nav>

    <footer class="drawer-footer">
        <small id="side-last-update"></small>
        <small id="build-info" style="opacity:0.55;display:block;margin-top:2px"></small>
    </footer>
</aside>

<div class="top-bar">
    <span id="toggle-cta" class="toggle-icon"><button>☰</button></span>
    <div class="top-search">
        <input type="text" id="drawer-search-input" placeholder='Search… (field:"value" | field:value | value)' />
        <button id="drawer-search-go">🔎</button>
        <button id="view-list" title="Vista elenco (tabella)">📋</button>
        <button id="view-graph" title="Vista grafo" style="display:none;">🕸️</button>

        <button id="act-clear">❌</button>
    </div>
</div>

<label id="label-file" class="custom-file-upload">
    <input type="file" id="fileInput" accept=".csv" class="file-input" />
    Select the CSV
</label>

<div id="map"></div>
<div id="list-view" class="list-view" style="display:none;"></div>
<div class="tooltip" id="tooltip" style="opacity: 0;"></div>
<div id="legend" class="legend"></div>

<div id="overlay" class="overlay"></div>

<div id="drawer" class="drawer">
    <div class="drawer-header">
        <h2>Service Information</h2>
        <button class="close-drawer" id="closeDrawer">✖</button>
    </div>
    <div id="drawerContent" class="drawer-content"></div>
</div>


<footer>
    <svg id="brand-logo"></svg>
    <p>Digital Service Management</p>
</footer>
</body>
</html>
