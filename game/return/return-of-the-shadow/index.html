<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Shadow" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>THE RETURN OF THE SHADOW — Prologue: The Ascent</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000;
                 overflow: hidden; position: fixed; inset: 0;
                 overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    /* the shim sets the canvas's pixel size in JS; here it just fills the frame */
    #game { display: block; width: 100%; height: 100%; touch-action: none; }
    /* --- touch controls (shown only on coarse-pointer devices, see touch.js) --- */
    #touch { position: fixed; inset: 0; pointer-events: none; display: none;
             font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    #touch.on { display: block; }
    .tbtn { position: absolute; pointer-events: auto; display: flex; align-items: center;
            justify-content: center; color: rgba(240,235,225,0.85); font-weight: 600;
            background: rgba(30,22,40,0.35); border: 1px solid rgba(240,220,200,0.25);
            border-radius: 14px; backdrop-filter: blur(2px); -webkit-tap-highlight-color: transparent;
            touch-action: none; }
    .tbtn.held { background: rgba(210,120,60,0.5); }
    .tbtn.round { border-radius: 50%; }
    /* --- rotate-to-landscape gate (mobile portrait only, see script below) --- */
    #rotate { position: fixed; inset: 0; z-index: 200; display: none;
              flex-direction: column; align-items: center; justify-content: center;
              gap: 22px; background: #0a0710; color: rgba(240,232,224,0.92);
              font-family: system-ui, sans-serif; text-align: center; padding: 24px;
              -webkit-user-select: none; user-select: none; }
    #rotate.show { display: flex; }
    #rotate .phone { width: 74px; height: 120px; border: 4px solid rgba(230,190,150,0.85);
              border-radius: 14px; position: relative;
              animation: rotatehint 2.2s ease-in-out infinite; }
    #rotate .phone::after { content: ''; position: absolute; left: 50%; bottom: 7px;
              width: 22px; height: 3px; background: rgba(230,190,150,0.7);
              border-radius: 2px; transform: translateX(-50%); }
    #rotate .msg { font-size: 19px; font-weight: 600; letter-spacing: 0.03em; }
    #rotate .sub { font-size: 14px; opacity: 0.7; max-width: 300px; line-height: 1.4; }
    @keyframes rotatehint {
      0%, 30% { transform: rotate(0deg); }
      55%, 80% { transform: rotate(-90deg); }
      100% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="touch"></div>
  <div id="rotate">
    <div class="phone"></div>
    <div class="msg">Please rotate your device</div>
    <div class="sub">The Return of the Shadow plays in landscape. Turn your phone sideways to continue.</div>
  </div>

  <!-- ?v is bumped on every release so phones/desktops never run a stale cached
       copy (mobile Safari caches JS very aggressively). Keep it in sync with
       BUILD in game.js. -->
  <script src="love-shim.js?v=2026-07-29-L6"></script>
  <!-- game.js is being split into src/ modules (see plans/modularization-refactor.md).
       These are plain classic scripts loaded IN ORDER — they share one top-level
       scope, so later files resolve earlier declarations by name. -->
  <script src="src/core/00-namespace.js?v=2026-07-29-L6"></script>
  <script src="src/core/01-constants.js?v=2026-07-29-L6"></script>
  <script src="src/core/02-utils.js?v=2026-07-29-L6"></script>
  <script src="src/core/03-level-data.js?v=2026-07-29-L6"></script>
  <script src="src/core/04-particles.js?v=2026-07-29-L6"></script>
  <script src="src/art/shared-art.js?v=2026-07-29-L6"></script>
  <script src="src/characters/player.js?v=2026-07-29-L6"></script>
  <script src="src/characters/enemies-l2.js?v=2026-07-29-L6"></script>
  <script src="src/characters/enemies-l3.js?v=2026-07-29-L6"></script>
  <script src="src/characters/enemies-l5.js?v=2026-07-29-L6"></script>
  <script src="src/characters/cast-l4.js?v=2026-07-29-L6"></script>
  <script src="src/levels/level1.js?v=2026-07-29-L6"></script>
  <script src="src/levels/level2.js?v=2026-07-29-L6"></script>
  <script src="src/levels/level3.js?v=2026-07-29-L6"></script>
  <script src="src/levels/level4.js?v=2026-07-29-L6"></script>
  <script src="src/levels/level5.js?v=2026-07-29-L6"></script>
  <!-- engine core loads LAST: it assigns the love.* callbacks and references
       every symbol above (resolved by name via the shared top-level scope). -->
  <script src="src/core/engine.js?v=2026-07-29-L6"></script>
  <script src="touch.js?v=2026-07-29-L6"></script>
  <script>
    love._run(document.getElementById('game'));

    // --- landscape gate (mobile only) ------------------------------------
    // On touch devices we only allow play in landscape. In portrait we show a
    // "rotate your device" overlay and pause the game (window.__ROTS_PAUSED__,
    // honored by love.update). Desktop is never affected.
    (function () {
      var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      var touch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
      var isMobile = coarse || touch;
      var overlay = document.getElementById('rotate');
      var touchUI = document.getElementById('touch');
      function isPortrait() {
        if (window.matchMedia && window.matchMedia('(orientation: portrait)').matches) return true;
        return window.innerHeight > window.innerWidth;
      }
      function check() {
        var block = isMobile && isPortrait();
        window.__ROTS_PAUSED__ = block;
        if (overlay) overlay.classList.toggle('show', block);
        // hide the on-screen buttons behind the overlay so nothing peeks through
        if (touchUI) touchUI.style.visibility = block ? 'hidden' : '';
      }
      window.addEventListener('resize', check);
      window.addEventListener('orientationchange', function () {
        check(); setTimeout(check, 250); setTimeout(check, 600);
      });
      if (window.matchMedia) {
        try { window.matchMedia('(orientation: portrait)').addEventListener('change', check); }
        catch (e) { try { window.matchMedia('(orientation: portrait)').addListener(check); } catch (e2) {} }
      }
      check();

      // Mobile: browsers only grant fullscreen from a user gesture, so request
      // it once on the very first tap (best-effort — ignored where unsupported).
      if (isMobile) {
        var fsTried = false;
        function goFullscreen() {
          if (fsTried) return; fsTried = true;
          var el = document.documentElement;
          try {
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          } catch (e) {}
          window.removeEventListener('touchend', goFullscreen);
          window.removeEventListener('pointerdown', goFullscreen);
        }
        window.addEventListener('touchend', goFullscreen, { passive: true });
        window.addEventListener('pointerdown', goFullscreen, { passive: true });
      }
    })();
  </script>
</body>
</html>
