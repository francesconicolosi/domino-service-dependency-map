<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>THE RETURN OF THE SHADOW — Prologue: The Ascent</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000;
                 overflow: hidden; position: fixed; inset: 0;
                 overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    /* the shim sets the canvas's pixel size in JS; here it just fills the frame */
    #game { display: block; width: 100%; height: 100%; touch-action: none; }
    /* --- touch controls (shown only on coarse-pointer devices, see touch.js) --- */
    #touch { position: fixed; inset: 0; pointer-events: none; display: none;
             font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    #touch.on { display: block; }
    .tbtn { position: absolute; pointer-events: auto; display: flex; align-items: center;
            justify-content: center; color: rgba(240,235,225,0.85); font-weight: 600;
            background: rgba(30,22,40,0.35); border: 1px solid rgba(240,220,200,0.25);
            border-radius: 14px; backdrop-filter: blur(2px); -webkit-tap-highlight-color: transparent;
            touch-action: none; }
    .tbtn.held { background: rgba(210,120,60,0.5); }
    .tbtn.round { border-radius: 50%; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="touch"></div>

  <!-- ?v is bumped on every release so phones/desktops never run a stale cached
       copy (mobile Safari caches JS very aggressively). Keep it in sync with
       BUILD in game.js. -->
  <script src="love-shim.js?v=2026-07-24d"></script>
  <script src="game.js?v=2026-07-24d"></script>
  <script src="touch.js?v=2026-07-24d"></script>
  <script>
    love._run(document.getElementById('game'));
  </script>
</body>
</html>
